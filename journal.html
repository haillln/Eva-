<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>journal — EVA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B0E14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>

  <template id="eva-page-content">
    <!-- ============================================================
         EVA — TRADING JOURNAL
         Stage 1: HTML + CSS structure only. No JavaScript logic,
         no Firebase calls. IDs/classes are prepared for the later
         JS/Firebase stage.
         ============================================================ -->

    <style>
      /* =========================================================
         SCOPE: everything below is namespaced with "jr-" and only
         reuses the CSS custom properties already defined by the
         shared layout (--eva-bg, --eva-surface, --eva-text, etc.)
         so dark/light mode keeps working with zero extra wiring.
         ========================================================= */
      .jr-wrap{
        --jr-radius-lg:18px;
        --jr-radius-md:14px;
        --jr-radius-sm:10px;
        --jr-gap:20px;
        --jr-win:#22C55E;
        --jr-win-bg:rgba(34,197,94,0.14);
        --jr-loss:#EF4444;
        --jr-loss-bg:rgba(239,68,68,0.14);
        --jr-be:#F59E0B;
        --jr-be-bg:rgba(245,158,11,0.14);
        --jr-long:#22C55E;
        --jr-short:#EF4444;
        max-width:1400px;
        margin:0 auto;
        padding-bottom:40px;
        font-family:var(--eva-font-body);
        color:var(--eva-text);
      }

      .jr-wrap *{ box-sizing:border-box; }
      .jr-wrap h1,.jr-wrap h2,.jr-wrap h3,.jr-wrap p,.jr-wrap span,.jr-wrap label{ color:inherit; }
      .jr-wrap button{ font-family:inherit; cursor:pointer; }
      .jr-wrap input,.jr-wrap select,.jr-wrap textarea{ font-family:inherit; }

      /* ---------------------------------------------------------
         SECTION SPACING
         --------------------------------------------------------- */
      .jr-section{ margin-bottom:22px; }

      /* ---------------------------------------------------------
         1. WELCOME
         --------------------------------------------------------- */
      .jr-welcome h1{
        font-family:var(--eva-font-display);
        font-size:1.7rem;
        font-weight:700;
        letter-spacing:-0.3px;
        margin-bottom:4px;
      }
      .jr-welcome p{
        color:var(--eva-text-dim);
        font-size:0.92rem;
      }

      /* ---------------------------------------------------------
         2. ACCOUNT SELECTOR + ACTIONS
         --------------------------------------------------------- */
      .jr-toolbar{
        display:flex;
        flex-wrap:wrap;
        align-items:center;
        justify-content:space-between;
        gap:12px;
      }
      .jr-account-block{ display:flex; flex-direction:column; gap:6px; }
      .jr-account-label{
        font-size:0.72rem;
        font-weight:700;
        text-transform:uppercase;
        letter-spacing:0.06em;
        color:var(--eva-text-dim);
      }
      .jr-select{
        display:flex; align-items:center; gap:10px;
        background:var(--eva-surface);
        border:1px solid var(--eva-border);
        border-radius:var(--jr-radius-sm);
        padding:10px 14px;
        min-width:200px;
        font-size:0.9rem;
        font-weight:600;
        color:var(--eva-text);
        appearance:none;
        -webkit-appearance:none;
        cursor:pointer;
      }
      .jr-select-wrap{ position:relative; }
      .jr-select-wrap svg{
        position:absolute; right:12px; top:50%; transform:translateY(-50%);
        width:16px; height:16px; stroke:var(--eva-text-dim); fill:none; stroke-width:2;
        pointer-events:none;
      }

      /* ---------------------------------------------------------
         CUSTOM ACCOUNT SELECTOR (dropdown panel)
         --------------------------------------------------------- */
      .jr-account-dropdown{ position:relative; }
      .jr-account-trigger{
        display:flex; align-items:center; gap:10px;
        background:var(--eva-surface);
        border:1px solid var(--eva-border);
        border-radius:var(--jr-radius-sm);
        padding:10px 14px;
        min-width:220px;
        font-size:0.9rem;
        font-weight:600;
        color:var(--eva-text);
        cursor:pointer;
        transition:border-color .2s var(--eva-ease), background-color .2s var(--eva-ease);
      }
      .jr-account-trigger:hover{ background:var(--eva-surface-2); }
      .jr-account-trigger.jr-open{ border-color:var(--eva-accent-1); }
      .jr-account-trigger-dot{
        width:9px; height:9px; border-radius:50%; flex-shrink:0;
        background:var(--eva-accent-1);
      }
      .jr-account-trigger-name{
        flex:1; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      }
      .jr-account-trigger-chevron{
        width:16px; height:16px; stroke:var(--eva-text-dim); fill:none; stroke-width:2;
        flex-shrink:0; transition:transform .2s var(--eva-ease);
      }
      .jr-account-trigger.jr-open .jr-account-trigger-chevron{ transform:rotate(180deg); }

      .jr-account-panel{
        position:absolute; top:calc(100% + 8px); left:0;
        min-width:280px; max-width:340px;
        max-height:360px; overflow-y:auto;
        background:var(--eva-surface);
        border:1px solid var(--eva-border);
        border-radius:var(--jr-radius-md);
        box-shadow:0 16px 40px rgba(0,0,0,0.35);
        z-index:40;
        display:none;
      }
      .jr-account-panel.jr-open{ display:block; }
      .jr-account-panel-header{
        padding:12px 16px 8px;
        font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em;
        color:var(--eva-text-dim);
        border-bottom:1px solid var(--eva-border);
      }
      .jr-account-list{ padding:6px; display:flex; flex-direction:column; gap:2px; }
      .jr-account-item{
        display:flex; align-items:center; gap:10px;
        width:100%; text-align:left;
        background:transparent; border:none; border-radius:var(--jr-radius-sm);
        padding:10px; cursor:pointer;
        transition:background-color .15s var(--eva-ease);
      }
      .jr-account-item:hover{ background:var(--eva-surface-2); }
      .jr-account-item.jr-active{ background:color-mix(in srgb, var(--eva-accent-1) 12%, transparent); }
      .jr-account-item-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; background:var(--eva-accent-1); }
      .jr-account-item-info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
      .jr-account-item-name{ font-size:0.88rem; font-weight:700; color:var(--eva-text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .jr-account-item-meta{ font-size:0.75rem; color:var(--eva-text-dim); display:flex; align-items:center; gap:6px; }
      .jr-account-item-status{
        display:inline-flex; align-items:center; padding:1px 7px; border-radius:999px;
        font-size:0.66rem; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
        background:var(--jr-win-bg); color:var(--jr-win);
      }
      .jr-account-item-status.jr-status-demo{ background:var(--jr-be-bg); color:var(--jr-be); }
      .jr-account-item-check{ width:16px; height:16px; stroke:var(--eva-accent-1); fill:none; stroke-width:2.4; flex-shrink:0; }
      .jr-account-empty{ padding:16px; text-align:center; font-size:0.82rem; color:var(--eva-text-dim); }

      /* ---------------------------------------------------------
         DARK MODE FIX — account dropdown readability.
         Light mode is untouched (rules below only ever apply
         inside a dark-mode scope). This forces readable, high
         contrast colors on the trigger + panel regardless of
         which convention the shell uses to flag dark mode, so it
         keeps working even if that convention changes later.
         --------------------------------------------------------- */
      html.dark .jr-account-trigger, body.dark .jr-account-trigger,
      html[data-theme="dark"] .jr-account-trigger, body[data-theme="dark"] .jr-account-trigger,
      .dark-mode .jr-account-trigger, .theme-dark .jr-account-trigger,
      html.dark .jr-account-panel, body.dark .jr-account-panel,
      html[data-theme="dark"] .jr-account-panel, body[data-theme="dark"] .jr-account-panel,
      .dark-mode .jr-account-panel, .theme-dark .jr-account-panel{
        background:#161B26 !important;
        border-color:#2A3142 !important;
      }
      html.dark .jr-account-trigger-name, body.dark .jr-account-trigger-name,
      html[data-theme="dark"] .jr-account-trigger-name, body[data-theme="dark"] .jr-account-trigger-name,
      .dark-mode .jr-account-trigger-name, .theme-dark .jr-account-trigger-name,
      html.dark .jr-account-item-name, body.dark .jr-account-item-name,
      html[data-theme="dark"] .jr-account-item-name, body[data-theme="dark"] .jr-account-item-name,
      .dark-mode .jr-account-item-name, .theme-dark .jr-account-item-name,
      html.dark .jr-account-panel-header, body.dark .jr-account-panel-header,
      html[data-theme="dark"] .jr-account-panel-header, body[data-theme="dark"] .jr-account-panel-header,
      .dark-mode .jr-account-panel-header, .theme-dark .jr-account-panel-header{
        color:#F5F7FA !important;
      }
      html.dark .jr-account-item-meta, body.dark .jr-account-item-meta,
      html[data-theme="dark"] .jr-account-item-meta, body[data-theme="dark"] .jr-account-item-meta,
      .dark-mode .jr-account-item-meta, .theme-dark .jr-account-item-meta,
      html.dark .jr-account-empty, body.dark .jr-account-empty,
      html[data-theme="dark"] .jr-account-empty, body[data-theme="dark"] .jr-account-empty,
      .dark-mode .jr-account-empty, .theme-dark .jr-account-empty{
        color:#9AA3B5 !important;
      }
      html.dark .jr-account-item:hover, body.dark .jr-account-item:hover,
      html[data-theme="dark"] .jr-account-item:hover, body[data-theme="dark"] .jr-account-item:hover,
      .dark-mode .jr-account-item:hover, .theme-dark .jr-account-item:hover,
      html.dark .jr-account-trigger:hover, body.dark .jr-account-trigger:hover,
      html[data-theme="dark"] .jr-account-trigger:hover, body[data-theme="dark"] .jr-account-trigger:hover,
      .dark-mode .jr-account-trigger:hover, .theme-dark .jr-account-trigger:hover{
        background:#1E2532 !important;
      }
      html.dark .jr-account-item.jr-active, body.dark .jr-account-item.jr-active,
      html[data-theme="dark"] .jr-account-item.jr-active, body[data-theme="dark"] .jr-account-item.jr-active,
      .dark-mode .jr-account-item.jr-active, .theme-dark .jr-account-item.jr-active{
        background:rgba(139,92,246,0.18) !important;
      }

      .jr-actions{ display:flex; flex-wrap:wrap; gap:10px; }

      .jr-btn{
        display:inline-flex; align-items:center; gap:8px;
        border-radius:var(--jr-radius-sm);
        padding:10px 16px;
        font-size:0.86rem;
        font-weight:600;
        border:1px solid var(--eva-border);
        background:var(--eva-surface);
        color:var(--eva-text);
        transition:background-color .2s var(--eva-ease), border-color .2s var(--eva-ease), transform .15s var(--eva-ease);
        white-space:nowrap;
      }
      .jr-btn svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
      .jr-btn:hover{ background:var(--eva-surface-2); }
      .jr-btn:active{ transform:scale(0.97); }

      .jr-btn-primary{
        background:var(--eva-gradient);
        border:none;
        color:#fff;
        box-shadow:0 6px 18px rgba(99,102,241,0.35);
      }
      .jr-btn-primary:hover{ filter:brightness(1.06); }

      .jr-btn-danger{
        color:var(--jr-loss);
        border-color:rgba(239,68,68,0.35);
        background:rgba(239,68,68,0.08);
      }
      .jr-btn-danger:hover{ background:rgba(239,68,68,0.14); }

      .jr-btn-block{ width:100%; justify-content:center; }

      /* ---------------------------------------------------------
         3. TIME SELECTOR
         --------------------------------------------------------- */
      .jr-timebar{
        display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px;
      }
      .jr-segment{
        display:inline-flex;
        background:var(--eva-surface);
        border:1px solid var(--eva-border);
        border-radius:999px;
        padding:4px;
        gap:2px;
      }
      .jr-segment button{
        border:none; background:transparent; color:var(--eva-text-dim);
        font-size:0.85rem; font-weight:600;
        padding:9px 18px; border-radius:999px;
        transition:background-color .2s var(--eva-ease), color .2s var(--eva-ease);
      }
      .jr-segment button.jr-active{
        background:var(--eva-gradient);
        color:#fff;
      }

      .jr-month-nav{
        display:flex; align-items:center; gap:8px;
      }
      .jr-icon-btn{
        width:36px; height:36px; border-radius:var(--jr-radius-sm);
        display:flex; align-items:center; justify-content:center;
        background:var(--eva-surface); border:1px solid var(--eva-border); color:var(--eva-text);
      }
      .jr-icon-btn svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2.2; }
      .jr-month-select, .jr-year-select{
        background:var(--eva-surface);
        border:1px solid var(--eva-border);
        border-radius:var(--jr-radius-sm);
        padding:9px 14px;
        font-size:0.86rem; font-weight:600; color:var(--eva-text);
      }
      .jr-custom-range{ display:none; align-items:center; gap:10px; flex-wrap:wrap; }
      .jr-custom-range.jr-visible{ display:flex; }
      .jr-date-input{
        background:var(--eva-surface);
        border:1px solid var(--eva-border);
        border-radius:var(--jr-radius-sm);
        padding:9px 12px;
        font-size:0.85rem;
        color:var(--eva-text);
      }

      /* ---------------------------------------------------------
         4. ADVANCED FILTERS
         --------------------------------------------------------- */
      .jr-filters{
        background:var(--eva-surface);
        border:1px solid var(--eva-border);
        border-radius:var(--jr-radius-lg);
        padding:18px;
      }
      .jr-filters-head{
        display:flex; align-items:center; justify-content:space-between;
        margin-bottom:14px;
      }
      .jr-filters-title{
        display:flex; align-items:center; gap:8px;
        font-size:0.9rem; font-weight:700;
      }
      .jr-filters-title svg{ width:17px; height:17px; stroke:var(--eva-text-dim); fill:none; stroke-width:2; }

      .jr-filters-grid{
        display:grid;
        grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
        gap:14px;
      }
      .jr-field{ display:flex; flex-direction:column; gap:6px; min-width:0; }
      .jr-field label{
        font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em;
        color:var(--eva-text-dim);
      }
      .jr-field select, .jr-field input{
        background:var(--eva-surface-2);
        border:1px solid var(--eva-border);
        border-radius:var(--jr-radius-sm);
        padding:9px 12px;
        font-size:0.86rem;
        color:var(--eva-text);
        width:100%;
      }
      .jr-field input::placeholder{ color:var(--eva-text-dim); opacity:0.8; }
      .jr-field-range{ display:flex; align-items:center; gap:8px; }
      .jr-field-range span{ color:var(--eva-text-dim); }

      .jr-filters-foot{
        display:flex; justify-content:flex-end; gap:10px;
        margin-top:16px;
        padding-top:16px;
        border-top:1px solid var(--eva-border);
      }

      /* ---------------------------------------------------------
         5 / 6. WORKSPACE BAR + LIST/CARD SWITCH
         --------------------------------------------------------- */
      .jr-workspace-bar{
        display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px;
        padding:12px 4px;
      }
      .jr-workspace-meta{
        display:flex; align-items:center; gap:16px; flex-wrap:wrap;
        font-size:0.8rem; color:var(--eva-text-dim);
        text-transform:uppercase; letter-spacing:0.06em; font-weight:700;
      }
      .jr-workspace-meta b{
        color:var(--eva-text); font-weight:700; text-transform:none; letter-spacing:0;
        font-size:0.95rem; margin-left:6px;
      }
      .jr-view-switch{
        display:inline-flex; background:var(--eva-surface); border:1px solid var(--eva-border);
        border-radius:var(--jr-radius-sm); padding:3px; gap:2px;
      }
      .jr-view-switch button{
        display:flex; align-items:center; gap:6px;
        border:none; background:transparent; color:var(--eva-text-dim);
        font-size:0.82rem; font-weight:700;
        padding:8px 14px; border-radius:8px;
      }
      .jr-view-switch button svg{ width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2; }
      .jr-view-switch button.jr-active{ background:var(--eva-gradient); color:#fff; }

      /* ---------------------------------------------------------
         7. TRADE HISTORY — LIST VIEW (table)
         --------------------------------------------------------- */
      .jr-history{ position:relative; }
      .jr-view-panel{ display:none; }
      .jr-view-panel.jr-active-view{ display:block; }

      .jr-table-scroll{
        background:var(--eva-surface);
        border:1px solid var(--eva-border);
        border-radius:var(--jr-radius-lg);
        overflow-x:auto;
      }
      .jr-table{
        width:100%;
        border-collapse:collapse;
        min-width:1100px;
        font-size:0.84rem;
      }
      .jr-table thead th{
        text-align:left;
        padding:14px 12px;
        font-size:0.7rem;
        text-transform:uppercase;
        letter-spacing:0.06em;
        color:var(--eva-text-dim);
        background:var(--eva-surface-2);
        white-space:nowrap;
        position:sticky; top:0;
      }
      .jr-table thead th:first-child{ border-top-left-radius:var(--jr-radius-lg); }
      .jr-table thead th:last-child{ border-top-right-radius:var(--jr-radius-lg); }
      .jr-table tbody td{
        padding:14px 12px;
        border-top:1px solid var(--eva-border);
        white-space:nowrap;
        color:var(--eva-text);
      }
      .jr-table tbody tr{ transition:background-color .15s var(--eva-ease); }
      .jr-table tbody tr:hover{ background:var(--eva-surface-2); }

      .jr-table-actions{ display:flex; gap:6px; }

      .jr-row-check{ width:16px; height:16px; accent-color:var(--eva-accent-1); }

      /* ---------------------------------------------------------
         PILLS / TAGS (shared)
         --------------------------------------------------------- */
      .jr-pill{
        display:inline-flex; align-items:center; gap:4px;
        padding:4px 10px; border-radius:999px;
        font-size:0.72rem; font-weight:700; letter-spacing:0.02em;
      }
      .jr-pill-long{ color:var(--jr-long); background:rgba(34,197,94,0.14); }
      .jr-pill-short{ color:var(--jr-short); background:rgba(239,68,68,0.14); }
      .jr-pill-win{ color:var(--jr-win); background:var(--jr-win-bg); }
      .jr-pill-loss{ color:var(--jr-loss); background:var(--jr-loss-bg); }
      .jr-pill-be{ color:var(--jr-be); background:var(--jr-be-bg); }
      .jr-pill-neutral{ color:var(--eva-text-dim); background:var(--eva-surface-2); }

      /* ---------------------------------------------------------
         TRADE RATING (A+/A/B/C GRADE) — colors + badge + toggle
         --------------------------------------------------------- */
      .jr-pill-grade-Aplus{ color:#22C55E; background:rgba(34,197,94,0.14); }
      .jr-pill-grade-A{ color:#3B82F6; background:rgba(59,130,246,0.14); }
      .jr-pill-grade-B{ color:#F59E0B; background:rgba(245,158,11,0.14); }
      .jr-pill-grade-C{ color:#EF4444; background:rgba(239,68,68,0.14); }
      .jr-pill-grade-unrated{ color:var(--eva-text-dim); background:var(--eva-surface-2); }

      .jr-grade-text{ font-weight:700; }
      .jr-grade-text.jr-grade-Aplus{ color:#22C55E; }
      .jr-grade-text.jr-grade-A{ color:#3B82F6; }
      .jr-grade-text.jr-grade-B{ color:#F59E0B; }
      .jr-grade-text.jr-grade-C{ color:#EF4444; }
      .jr-grade-text.jr-grade-unrated{ color:var(--eva-text-dim); font-weight:600; }

      .jr-grade-toggle{ gap:6px; }
      .jr-grade-btn{ min-width:44px; text-align:center; justify-content:center; }
      .jr-grade-btn[data-grade="A+"].jr-selected{ background:rgba(34,197,94,0.14); border-color:#22C55E; color:#22C55E; }
      .jr-grade-btn[data-grade="A"].jr-selected{ background:rgba(59,130,246,0.14); border-color:#3B82F6; color:#3B82F6; }
      .jr-grade-btn[data-grade="B"].jr-selected{ background:rgba(245,158,11,0.14); border-color:#F59E0B; color:#F59E0B; }
      .jr-grade-btn[data-grade="C"].jr-selected{ background:rgba(239,68,68,0.14); border-color:#EF4444; color:#EF4444; }

      .jr-profit-pos{ color:var(--jr-win); font-weight:700; }
      .jr-profit-neg{ color:var(--jr-loss); font-weight:700; }

      .jr-icon-action{
        width:32px; height:32px; border-radius:8px;
        display:flex; align-items:center; justify-content:center;
        background:var(--eva-surface-2); border:1px solid var(--eva-border); color:var(--eva-text-dim);
        transition:color .2s var(--eva-ease), border-color .2s var(--eva-ease);
      }
      .jr-icon-action svg{ width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
      .jr-icon-action:hover{ color:var(--eva-text); }
      .jr-icon-action.jr-danger:hover{ color:var(--jr-loss); border-color:rgba(239,68,68,0.4); }
      .jr-icon-action.jr-share:hover{ color:var(--eva-accent-1); border-color:var(--eva-accent-1); }

      /* ---------------------------------------------------------
         8. TRADE HISTORY — CARD VIEW
         --------------------------------------------------------- */
      .jr-card-grid{
        display:grid;
        grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
