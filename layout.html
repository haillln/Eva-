<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>EVA — Layout</title>

<!-- ============================================================
     EVA LAYOUT SYSTEM
     Reusable across dashboard.html / journal.html / analyze.html /
     accounts.html / settings.html — copy <head> + <body> into each
     page and drop that page's content into <main id="eva-page">.

     The bottom navigation block below (marked LOCKED) is byte-for-
     byte identical to the original file: same CSS selectors, same
     HTML, same inline <script>. Nothing in it was renamed,
     restructured, or given new attributes. The only change made
     to it anywhere is that its demo-only "Screen Content Area"
     (.view-display) is hidden with one external display:none rule,
     written outside the locked block, so its markup and script
     stay 100% intact but nothing demo-related shows on screen.

     TRANSITION / BLACK-SCREEN FIX — what changed and why:
     Every page here is a separate full HTML document, so each
     click is a real browser navigation, not an SPA route change.
     The old version put its theme-apply / active-nav / nav-click
     logic *inside* the Firebase `<script type="module">` block.
     Module scripts only start executing after their imports finish
     downloading — so on every single navigation, the whole shell
     (theme, active state, working nav) sat frozen until three
     Firebase SDK files had round-tripped over the network, and
     `#eva-page`'s only case for showing anything before "loading" is now bulletproof-styled the whole way.
     Three concrete fixes:
       1. An inline, non-module script at the very top of <head>
          sets the theme attribute before the browser paints
          anything, so there is never an unstyled/mismatched flash.
       2. `html` (not just `body`) now carries a hard-coded
          background fallback, and a `color-scheme` meta tag is set,
          so if content is hidden while waiting on auth, what's
          behind it is always the correct themed color — never an
          unstyled or browser/OS forced-dark black frame.
       3. All shell wiring that doesn't need Firebase (nav clicks,
          sidebar, more-menu, theme toggle, active states) now runs
          in a plain script that executes immediately, independent
          of network speed. Firebase is preloaded via `modulepreload`
          so its fetch starts at the top of <head> instead of after
          the whole page has parsed, and a short safety-net timeout
          reveals the shell even if Firebase is slow or fails to
          load, so a flaky connection can no longer leave the app
          stuck invisible.
       4. `@view-transition { navigation: auto; }` opts every
          cross-page navigation into the browser's native
          cross-document view transition, giving a smooth crossfade
          between pages in supporting browsers instead of a hard
          cut. It's a progressive enhancement — browsers without
          support simply keep the (now-fixed) instant behavior.
     ============================================================ -->

<!-- Runs before any stylesheet/font/network request: applies the
     saved theme instantly so there is no flash of the wrong theme
     and no unstyled paint. -->
<script>
(function () {
  var t = 'dark';
  try { t = localStorage.getItem('eva-theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
  var root = document.documentElement;
  root.setAttribute('data-eva-theme', t);
  root.style.colorScheme = t;
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Start fetching the Firebase modules immediately, in parallel
     with everything else, instead of only once the parser reaches
     the <script type="module"> tag near the end of <body>. -->
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js" crossorigin>

<!-- ============================================================
     PWA — installability. This <head> becomes the live document
     head for every app page (eva-loader.js swaps it in), so this
     is the single place these tags need to live.
     ============================================================ -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0E14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EVA">

<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
  /* =========================================================
     LOCKED BOTTOM NAVIGATION — EXACT CSS FROM YOUR FILE
     Not one property changed, renamed, or reordered.
     ========================================================= */
  :root {
    --bg-slate: #7a828a;       /* Slate background matching reference */
    --nav-bg: #0b0e14;         /* Deep dark navigation bar */
    --text-dim: #94a3b8;       /* Inactive icon color */
    --nav-height: 82px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: var(--bg-slate);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    overflow-x: hidden;
    color: #fff;
  }

  /* Screen Title Display */
  .view-display {
    position: fixed;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 90%;
  }

  .view-display h1 {
    font-size: 2.5rem;
    font-weight: 800;
    color: #0b0e14;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }

  .view-display p {
    color: #2d3748;
    font-size: 1rem;
    font-weight: 500;
  }

  /* =========================================================
     2. FULL-WIDTH NAVIGATION BAR
     ========================================================= */
  .nav-wrapper {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: var(--nav-height);
    background-color: var(--nav-bg);
    border: none;
    box-shadow: 0 -8px 25px rgba(0, 0, 0, 0.35);
    z-index: 999;
  }

  .btn-layer {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 4px;
  }

  /* Navigation Buttons */
  .nav-btn {
    position: relative;
    flex: 1;
    height: 100%;
    background: none;
    border: none;
    outline: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    transition: all 0.3s ease;
  }

  /* Base Icon Circle Container */
  .icon-circle {
    position: relative;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    box-shadow: none;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.3s ease, box-shadow 0.3s ease, width 0.3s ease, height 0.3s ease;
    z-index: 2;
  }

  .icon-circle svg {
    width: 24px;
    height: 24px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: all 0.3s ease;
  }

  /* Hidden Labels by Default */
  .btn-label {
    font-size: 11px;
    font-weight: 700;
    opacity: 0;
    max-height: 0;
    transform: translateY(8px);
    transition: opacity 0.25s ease, transform 0.3s ease, max-height 0.25s ease, margin-top 0.25s ease;
    color: #ffffff;
    pointer-events: none;
  }

  /* =========================================================
     3. ACTIVE WHITE CIRCLE (SINGLE SOLID CIRCLE ONLY)
     ========================================================= */
  .nav-btn.active .icon-circle {
    width: 64px;                  
    height: 64px;
    transform: translateY(-30px); /* Pops up so ~40% is outside the nav bar */
    background: #ffffff;         /* Pure crisp white circle */
    
    /* Subtle natural drop shadow only; no extra outer ring background */
    box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4); 
  }

  /* High-contrast dark stroke inside active white circle */
  .nav-btn.active .icon-circle svg {
    width: 26px;
    height: 26px;
    stroke: #0b0e14;
    stroke-width: 2.2;
  }

  /* Reveal Label centered underneath active circle */
  .nav-btn.active .btn-label {
    opacity: 1;
    max-height: 16px;
    margin-top: -16px;
    transform: translateY(0);
  }
  /* ========== END OF LOCKED BOTTOM-NAV CSS ========== */


  /* =========================================================
     EVA LAYOUT SYSTEM — everything below is new, and lives
     entirely outside the locked block above. Hides only the
     demo "Screen Content Area" without touching its markup.
     ========================================================= */
  .view-display{ display:none; }

  /* Cross-document navigation crossfade (progressive enhancement —
     unsupported browsers just skip straight to the fixed instant
     behavior below, no fallback code needed). */
  @view-transition{
    navigation: auto;
  }
  ::view-transition-old(root),
  ::view-transition-new(root){
    animation-duration: 0.18s;
  }

  :root{
    --eva-font-display:'Space Grotesk', system-ui, sans-serif;
    --eva-font-body:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

    --eva-accent-1:#6366F1;
    --eva-accent-2:#A855F7;
    --eva-accent-3:#EC4899;
    --eva-gradient:linear-gradient(135deg, var(--eva-accent-1) 0%, var(--eva-accent-2) 55%, var(--eva-accent-3) 100%);

    --eva-topbar-h:68px;
    --eva-sidebar-w:264px;
    --eva-ease:cubic-bezier(0.4,0,0.2,1);
  }

  html[data-eva-theme="light"]{
    --eva-bg:#F6F7F9;
    --eva-surface:#FFFFFF;
    --eva-surface-2:#EEF0F4;
    --eva-border:rgba(11,14,20,0.09);
    --eva-text:#0B0E14;
    --eva-text-dim:#5B6472;
    --eva-shadow:0 8px 28px rgba(16,20,30,0.08);
  }
  html[data-eva-theme="dark"]{
    --eva-bg:#0B0E14;
    --eva-surface:#12161F;
    --eva-surface-2:#1A1F2B;
    --eva-border:rgba(255,255,255,0.08);
    --eva-text:#F5F6F8;
    --eva-text-dim:#94A3B8;
    --eva-shadow:0 8px 28px rgba(0,0,0,0.45);
  }

  /* Hard-coded fallback (not the variable) so the very first paint —
     before any attribute or custom property has necessarily
     resolved — is always a themed color, never an unstyled or
     forced-dark black frame. The instant inline script in <head>
     makes this match the real theme within one animation frame. */
  html{ background:#0B0E14; }

  /* ---- App shell: fits the viewport exactly, no page-level scroll ---- */
  html, body{
    height: 100%;
    overscroll-behavior: none;
  }
  body{
    /* overrides the locked body's background/layout properties for
       the app shell, without editing the locked rule itself */
    height: 100dvh;
    overflow: hidden;
    display: block;
    background: var(--eva-bg);
    color: var(--eva-text);
    font-family: var(--eva-font-body);
    -webkit-font-smoothing: antialiased;
    transition: background-color .25s var(--eva-ease), color .25s var(--eva-ease);
  }
  /* Hidden until the auth check resolves (or the safety-net timeout
     fires) so unauthenticated users never see a frame of protected
     content. Because `html` above always carries a correct themed
     background, this waiting state now renders as a clean, correctly
     colored screen instead of black/blank/unstyled. */
  body:not(.eva-ready){ visibility:hidden; }

  a{color:inherit; text-decoration:none;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--eva-accent-2); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }

  .eva-logo{
    height:34px;
    width:auto;
    display:block;
  }
  .eva-logo-dark{ display:none; }
  html[data-eva-theme="dark"] .eva-logo-light{ display:none; }
  html[data-eva-theme="dark"] .eva-logo-dark{ display:block; }

  /* =========================================================
     MOBILE TOP BAR
     ========================================================= */
  .eva-topbar-mobile{
    position:fixed; top:0; left:0; width:100%; height:var(--eva-topbar-h);
    background:var(--eva-surface);
    border-bottom:1px solid var(--eva-border);
    display:flex; align-items:center;
    padding:0 20px;
    z-index:950;
  }

  /* =========================================================
     DESKTOP TOP BAR
     ========================================================= */
  .eva-topbar-desktop{
    display:none;
    position:fixed; top:0; left:0; width:100%; height:var(--eva-topbar-h);
    background:var(--eva-surface);
    border-bottom:1px solid var(--eva-border);
    align-items:center; justify-content:space-between;
    padding:0 28px;
    z-index:950;
  }
  .eva-menu-btn{
    width:40px; height:40px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:1px solid var(--eva-border);
    cursor:pointer; color:var(--eva-text);
    transition:background-color .2s var(--eva-ease);
  }
  .eva-menu-btn:hover{ background:var(--eva-surface-2); }
  .eva-menu-btn svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round;}

  /* =========================================================
     DESKTOP SIDEBAR — sits BELOW the top bar so opening it
     never covers the logo.
     ========================================================= */
  .eva-sidebar-backdrop{
    position:fixed; left:0; right:0; bottom:0; top:var(--eva-topbar-h);
    background:rgba(6,8,12,0.45);
    opacity:0; pointer-events:none; transition:opacity .3s var(--eva-ease);
    z-index:930;
  }
  .eva-sidebar-backdrop.eva-open{ opacity:1; pointer-events:auto; }

  .eva-sidebar{
    position:fixed; top:var(--eva-topbar-h); left:0;
    height:calc(100% - var(--eva-topbar-h)); width:var(--eva-sidebar-w);
    background:var(--eva-surface);
    border-right:1px solid var(--eva-border);
    transform:translateX(-100%);
    transition:transform .35s var(--eva-ease);
    z-index:940;
    display:none;
    flex-direction:column;
    padding:18px 16px;
    overflow-y:auto;
  }
  .eva-sidebar.eva-open{ transform:translateX(0); box-shadow:var(--eva-shadow); }

  .eva-sidebar-nav{ display:flex; flex-direction:column; gap:4px; }
  .eva-sidebar-link{
    display:flex; align-items:center; gap:12px;
    padding:11px 12px; border-radius:10px;
    color:var(--eva-text-dim); font-weight:500; font-size:0.92rem;
    cursor:pointer; border:none; background:none; width:100%; text-align:left;
    transition:background-color .2s var(--eva-ease), color .2s var(--eva-ease);
  }
  .eva-sidebar-link svg{width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0;}
  .eva-sidebar-link:hover{ background:var(--eva-surface-2); color:var(--eva-text); }
  .eva-sidebar-link.eva-active{ background:var(--eva-surface-2); color:var(--eva-text); }

  .eva-pulse{ display:flex; align-items:flex-end; gap:2px; height:14px; margin-left:auto; opacity:0; }
  .eva-sidebar-link.eva-active .eva-pulse{ opacity:1; }
  .eva-pulse span{ width:2.5px; border-radius:2px; background:var(--eva-gradient); display:block; animation:eva-eq 1.1s ease-in-out infinite; }
  .eva-pulse span:nth-child(1){ height:6px; animation-delay:-.9s; }
  .eva-pulse span:nth-child(2){ height:14px; animation-delay:-.5s; }
  .eva-pulse span:nth-child(3){ height:9px; animation-delay:-.2s; }
  @keyframes eva-eq{ 0%,100%{ transform:scaleY(0.55);} 50%{ transform:scaleY(1);} }

  .eva-sidebar-divider{ height:1px; background:var(--eva-border); margin:14px 4px; flex-shrink:0; }
  .eva-sidebar-spacer{ flex:1; }

  /* ---- sidebar footer order: 1 profile, 2 theme, 3 logout ---- */
  .eva-sidebar-footer{ display:flex; flex-direction:column; gap:2px; }

  .eva-profile{
    display:flex; align-items:center; gap:11px;
    padding:9px 10px; border-radius:12px; cursor:pointer;
    background:none; border:none; width:100%; text-align:left;
    transition:background-color .2s var(--eva-ease);
  }
  .eva-profile:hover{ background:var(--eva-surface-2); }
  .eva-profile-avatar{
    width:36px; height:36px; border-radius:50%; flex-shrink:0;
    background:var(--eva-gradient); padding:2px;
  }
  .eva-profile-avatar img{ width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; background:var(--eva-surface); }
  .eva-profile-meta{ min-width:0; }
  .eva-profile-name{ font-size:0.86rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--eva-text); }
  .eva-profile-email{ font-size:0.75rem; color:var(--eva-text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .eva-profile-badge{
    display:inline-block; margin-top:5px;
    font-size:0.66rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    color:var(--eva-accent-1);
    background:color-mix(in srgb, var(--eva-accent-1) 16%, transparent);
    padding:2px 8px; border-radius:999px;
  }

  .eva-theme-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 10px;
  }
  .eva-theme-row span{ font-size:0.85rem; color:var(--eva-text-dim); font-weight:500; }

  /* ---- Glass toggle, matches the reference image exactly ---- */
  .eva-theme-toggle{
    position:relative; width:58px; height:30px; border-radius:999px;
    background:linear-gradient(180deg, rgba(30,32,38,0.92), rgba(10,11,15,0.96));
    border:1px solid rgba(255,255,255,0.12);
    box-shadow:inset 0 1px 2px rgba(255,255,255,0.06), 0 4px 10px rgba(0,0,0,0.35);
    cursor:pointer; padding:0; flex-shrink:0;
  }
  .eva-toggle-thumb{
    position:absolute; top:2px; left:2px; width:24px; height:24px; border-radius:50%;
    background:linear-gradient(160deg, rgba(255,255,255,0.22), rgba(255,255,255,0.04));
    backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,0.28);
    box-shadow:0 0 10px rgba(255,255,255,0.35), 0 2px 6px rgba(0,0,0,0.4);
    display:flex; align-items:center; justify-content:center;
    transition:transform .3s var(--eva-ease);
  }
  html[data-eva-theme="dark"] .eva-toggle-thumb{ transform:translateX(28px); }
  .eva-toggle-thumb svg{ width:13px; height:13px; stroke:#F5F6F8; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .eva-icon-moon{ display:none; }
  html[data-eva-theme="dark"] .eva-icon-sun{ display:none; }
  html[data-eva-theme="dark"] .eva-icon-moon{ display:block; fill:#F5F6F8; stroke:none; }

  .eva-logout{
    display:flex; align-items:center; gap:10px;
    padding:11px 10px; border-radius:10px;
    background:none; border:none; width:100%; text-align:left;
    color:var(--eva-text-dim); font-weight:500; font-size:0.88rem; cursor:pointer;
    transition:background-color .2s var(--eva-ease), color .2s var(--eva-ease);
  }
  .eva-logout:hover{ background:var(--eva-surface-2); color:#ef4444; }
  .eva-logout svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}

  /* =========================================================
     MOBILE MORE ACTION MENU — mobile only
     ========================================================= */
  .eva-mobile-more-backdrop{position:fixed;inset:0;background:rgba(5,7,12,.46);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .28s var(--eva-ease);z-index:1100;}
  .eva-mobile-more-backdrop.eva-open{opacity:1;pointer-events:auto;}
  .eva-mobile-more{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-height) + env(safe-area-inset-bottom) + 12px);max-width:520px;margin:0 auto;padding:10px;border:1px solid var(--eva-border);border-radius:24px;background:color-mix(in srgb,var(--eva-surface) 94%,transparent);box-shadow:0 24px 70px rgba(0,0,0,.28);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);transform:translateY(22px) scale(.97);opacity:0;pointer-events:none;transition:transform .32s cubic-bezier(.22,1,.36,1),opacity .25s ease;z-index:1110;}
  .eva-mobile-more.eva-open{transform:translateY(0) scale(1);opacity:1;pointer-events:auto;}
  .eva-mobile-more-head{display:flex;align-items:center;justify-content:space-between;padding:7px 8px 10px 10px;}
  .eva-mobile-more-title{font-family:var(--eva-font-display);font-size:.9rem;font-weight:700;color:var(--eva-text);}
  .eva-mobile-more-close{width:34px;height:34px;border:1px solid var(--eva-border);border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--eva-surface-2);color:var(--eva-text);cursor:pointer;}
  .eva-mobile-more-close svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;}
  .eva-mobile-more-actions{display:flex;flex-direction:column;gap:6px;}
  .eva-mobile-more-action{width:100%;min-height:58px;display:flex;align-items:center;gap:13px;padding:9px 11px;border:1px solid transparent;border-radius:16px;background:transparent;color:var(--eva-text);text-align:left;cursor:pointer;transition:background-color .2s ease,border-color .2s ease,transform .2s ease;}
  .eva-mobile-more-action:active{transform:scale(.985);}
  .eva-mobile-more-action:hover{background:var(--eva-surface-2);border-color:var(--eva-border);}
  .eva-mobile-more-icon{width:40px;height:40px;flex:0 0 40px;display:flex;align-items:center;justify-content:center;border-radius:13px;background:color-mix(in srgb,var(--eva-accent-1) 12%,var(--eva-surface));color:var(--eva-accent-1);}
  .eva-mobile-more-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .eva-mobile-more-copy{min-width:0;flex:1;}
  .eva-mobile-more-label{display:block;font-size:.9rem;font-weight:650;color:var(--eva-text);}

       PWA — service worker registration. Plain, non-module,
       runs immediately (does not wait on Firebase). Registered
       relative to this page's own path so it works the same way
       whichever page loaded the shell.
       Update handling: when a new service-worker.js is deployed,
       the waiting worker is told to activate itself once no other
       tab still needs the old one's cached shell, then this page
       reloads exactly once to pick it up — so an old, stale shell
       can never keep being served after a new version ships.
       ========================================================= -->
  <script>
  (function () {
    if (!('serviceWorker' in navigator)) return;
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('service-worker.js').then(function (reg) {
        reg.addEventListener('updatefound', function () {
          var installing = reg.installing;
          if (!installing) return;
          installing.addEventListener('statechange', function () {
            if (installing.state === 'installed' && navigator.serviceWorker.controller) {
              // A new version is installed and ready; hand it control.
              reg.waiting && reg.waiting.postMessage('SKIP_WAITING');
            }
          });
        });
      }).catch(function (err) {
        console.warn('[EVA] Service worker registration failed:', err);
      });

      var refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    });
  })();

  <!-- =========================================================
       IMMEDIATE SHELL WIRING — plain script, no network
       dependency of any kind. Runs the instant the parser
       reaches it, so the shell (theme, active nav, sidebar,
       more-menu, nav clicks) is fully live regardless of how
       long Firebase takes to load. Nothing here calls Firebase;
       it only reads/writes localStorage and the DOM. The actual
       Firestore sync and sign-out network calls are attached
       separately by the module script below, on the same
       elements, once Firebase is ready.
       ========================================================= -->
  <script>
  (function () {
    const root = document.documentElement;

    function updateThemeLabel(theme){
      const label = document.getElementById('eva-theme-label');
      if (label) label.textContent = theme === 'dark' ? 'Light mode' : 'Dark mode';
    }

    function applyTheme(theme){
      root.setAttribute('data-eva-theme', theme);
      root.style.colorScheme = theme;
      try { localStorage.setItem('eva-theme', theme); } catch (e) {}
      updateThemeLabel(theme);
      document.getElementById('eva-mobile-light-choice')?.classList.toggle('eva-selected', theme === 'light');
      document.getElementById('eva-mobile-dark-choice')?.classList.toggle('eva-selected', theme === 'dark');
    }
    // Exposed so the Firebase module script can apply a theme it
    // pulls down from Firestore, and can read the current theme
    // when it needs to push a locally-made change back up.
    window.__evaApplyTheme = applyTheme;
    updateThemeLabel(root.getAttribute('data-eva-theme') || 'dark');

    /* ---------- ACTIVE PAGE ---------- */
    const currentFile = (location.pathname.split('/').pop() || 'dashboard.html').toLowerCase();
    const currentPage = currentFile.replace('.html', '') || 'dashboard';
    const NAME_TO_PAGE = { dashboard:'dashboard', journal:'journal', analyze:'analyze', funded:'challenge', account:'accounts', accounts:'accounts', settings:'settings', challenge:'challenge', more:null };

    document.querySelectorAll('.nav-btn').forEach(btn => {
      const name = (btn.getAttribute('data-name') || '').toLowerCase();
      btn.classList.toggle('active', NAME_TO_PAGE[name] === currentPage);
    });
    document.querySelectorAll('.eva-sidebar-link').forEach(el => {
      el.classList.toggle('eva-active', el.getAttribute('data-page') === currentPage);
    });

    /* ---------- NAVIGATION ---------- */
    let navigating = false;
    function goTo(href){
      if (navigating) return;
      navigating = true;
      window.location.href = href;
    }
    window.__evaGoTo = goTo;
    window.__evaIsNavigating = () => navigating;
    window.__evaCurrentPage = currentPage;

    document.querySelectorAll('.nav-btn').forEach(btn => {
      const name = (btn.getAttribute('data-name') || '').toLowerCase();
      const page = NAME_TO_PAGE[name];
      btn.addEventListener('click', () => {
        if (!page || page === currentPage || navigating) return;
        goTo(page + '.html');
      });
    });
    document.querySelectorAll('.eva-sidebar-link').forEach(el => {
      el.addEventListener('click', () => {
        const href = el.getAttribute('data-href');
        if (!href || el.getAttribute('data-page') === currentPage || navigating) return;
        document.querySelectorAll('.eva-sidebar-link').forEach(l => l.classList.remove('eva-active'));
        el.classList.add('eva-active');
        goTo(href);
      });
    });

    /* ---------- SIDEBAR OPEN/CLOSE ---------- */
    const sidebar = document.getElementById('eva-sidebar');
    const backdrop = document.getElementById('eva-sidebar-backdrop');
    const menuBtn = document.getElementById('eva-menu-btn');
    function setSidebar(open){
      sidebar.classList.toggle('eva-open', open);
      backdrop.classList.toggle('eva-open', open);
      sidebar.setAttribute('aria-hidden', String(!open));
      menuBtn.setAttribute('aria-expanded', String(open));
    }
    menuBtn.addEventListener('click', () => setSidebar(!sidebar.classList.contains('eva-open')));
    backdrop.addEventListener('click', () => setSidebar(false));

    /* ---------- MOBILE MORE MENU ---------- */
    const moreNavBtn = document.getElementById('eva-more-nav-btn');
    const moreMenu = document.getElementById('eva-mobile-more');
    const moreBackdrop = document.getElementById('eva-mobile-more-backdrop');
    const moreClose = document.getElementById('eva-mobile-more-close');
    function setMoreMenu(open){
      if (!moreMenu || !moreBackdrop) return;
      moreMenu.classList.toggle('eva-open', open);
      moreBackdrop.classList.toggle('eva-open', open);
      moreMenu.setAttribute('aria-hidden', String(!open));
      moreBackdrop.setAttribute('aria-hidden', String(!open));
      moreNavBtn?.setAttribute('aria-expanded', String(open));
    }
    window.__evaSetMoreMenu = setMoreMenu;
    moreNavBtn?.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); setMoreMenu(!moreMenu.classList.contains('eva-open')); });
    moreClose?.addEventListener('click', () => setMoreMenu(false));
    moreBackdrop?.addEventListener('click', () => setMoreMenu(false));
    document.getElementById('eva-mobile-settings')?.addEventListener('click', () => { setMoreMenu(false); if (!navigating && currentPage !== 'settings') goTo('settings.html'); });
    document.getElementById('eva-mobile-calculator')?.addEventListener('click', () => { setMoreMenu(false); if (!navigating && currentPage !== 'calculator') goTo('calculator.html'); });

    /* ---------- LOGOUT CONFIRM DIALOG (open/cancel only —
         the actual sign-out network call is wired by the
         Firebase module script below) ---------- */
    const logoutBackdrop = document.getElementById('eva-logout-confirm-backdrop');
    const logoutCancel = document.getElementById('eva-logout-cancel');
    function setLogoutConfirm(open){ logoutBackdrop?.classList.toggle('eva-open', open); logoutBackdrop?.setAttribute('aria-hidden', String(!open)); }
    window.__evaSetLogoutConfirm = setLogoutConfirm;
    function openLogoutConfirm(){ setMoreMenu(false); setLogoutConfirm(true); }
    document.getElementById('eva-logout-btn')?.addEventListener('click', openLogoutConfirm);
    document.getElementById('eva-mobile-logout')?.addEventListener('click', openLogoutConfirm);
    logoutCancel?.addEventListener('click', () => setLogoutConfirm(false));
    logoutBackdrop?.addEventListener('click', e => { if (e.target === logoutBackdrop) setLogoutConfirm(false); });

    document.addEventListener('keydown', e => { if (e.key === 'Escape') { setSidebar(false); setMoreMenu(false); setLogoutConfirm(false); } });

    /* ---------- LOCAL THEME TOGGLE (instant; Firestore sync
         is attached separately by the module script) ---------- */
    document.getElementById('eva-theme-toggle').addEventListener('click', () => {
      applyTheme(root.getAttribute('data-eva-theme') === 'dark' ? 'light' : 'dark');
    });
    document.getElementById('eva-mobile-light-choice')?.addEventListener('click', e => { e.stopPropagation(); applyTheme('light'); });
    document.getElementById('eva-mobile-dark-choice')?.addEventListener('click', e => { e.stopPropagation(); applyTheme('dark'); });

    /* ---------- PROFILE CLICK -> settings.html ---------- */
    document.getElementById('eva-profile-btn').addEventListener('click', () => {
      if (currentPage !== 'settings' && !navigating) goTo('settings.html');
    });

    /* ---------- SAFETY NET ----------
       If Firebase is slow, blocked (ad-blocker, flaky mobile
       network, offline), or fails outright, this still reveals
       the shell instead of leaving the screen hidden/black
       forever. The auth module below normally wins this race by
       a wide margin and will redirect unauthenticated users to
       login before this fires under any normal network
       condition; this is purely a last-resort so a failed
       network call can never soft-lock the app on a blank
       screen. ---------- */
    window.setTimeout(() => { document.body.classList.add('eva-ready'); }, 1500);
  })();
  </script>

  <!-- =========================================================
       FIREBASE + AUTH — module script, loads in parallel thanks
       to the modulepreload hints in <head>. Only handles things
       that genuinely need Firebase: the auth guard, profile data,
       cross-device theme sync, and sign-out. Everything else the
       shell needs is already live from the script above.
       ========================================================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import {
      getAuth, onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, setDoc
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDGh-M9Ps_fy1k8u-r0H899U0L-LQQBKZI",
      authDomain: "eval-61cd9.firebaseapp.com",
      projectId: "eval-61cd9",
      storageBucket: "eval-61cd9.firebasestorage.app",
      messagingSenderId: "843373749164",
      appId: "1:843373749164:web:cc93d5513895ca10065009",
      measurementId: "G-R6D77DNJXT"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const DEFAULT_AVATAR =
      "data:image/svg+xml;utf8," + encodeURIComponent(`
        <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'>
          <rect width='40' height='40' fill='#12161F'/>
          <circle cx='20' cy='15.5' r='6.5' fill='#94A3B8'/>
          <path d='M6 36c0-8 6-13 14-13s14 5 14 13' fill='#94A3B8'/>
        </svg>`);

    const applyTheme = window.__evaApplyTheme;
    const currentPage = window.__evaCurrentPage;

    /* ---------- THEME TOGGLE -> FIRESTORE SYNC ----------
         Attached alongside (not instead of) the instant local
         handler already wired above; this one only pushes the
         resulting theme to Firestore when a user is signed in. ---------- */
    document.getElementById('eva-theme-toggle').addEventListener('click', async () => {
      const user = auth.currentUser;
      if (!user) return;
      const theme = document.documentElement.getAttribute('data-eva-theme');
      try { await setDoc(doc(db, 'users', user.uid), { theme }, { merge: true }); }
      catch (err) { console.error('Failed to save theme:', err); }
    });
    document.getElementById('eva-mobile-light-choice')?.addEventListener('click', () => syncThemeIfSignedIn('light'));
    document.getElementById('eva-mobile-dark-choice')?.addEventListener('click', () => syncThemeIfSignedIn('dark'));
    async function syncThemeIfSignedIn(theme){
      const user = auth.currentUser;
      if (!user) return;
      try { await setDoc(doc(db, 'users', user.uid), { theme }, { merge:true }); }
      catch (err) { console.error('Failed to save theme:', err); }
    }

    /* ---------- SIGN OUT ---------- */
    const logoutConfirm = document.getElementById('eva-logout-confirm-btn');
    logoutConfirm?.addEventListener('click', async () => {
      if (!auth.currentUser) return;
      logoutConfirm.disabled = true; logoutConfirm.textContent = 'Logging out…';
      try { await signOut(auth); window.location.href = 'login.html'; }
      catch (err) {
        console.error('Logout failed:', err);
        logoutConfirm.disabled = false; logoutConfirm.textContent = 'Log Out';
        window.__evaSetLogoutConfirm?.(false);
        alert('Could not log out. Please try again.');
      }
    });

    /* ---------- AUTH GUARD + PROFILE DATA + THEME SYNC ---------- */
    onAuthStateChanged(auth, async (user) => {
      if (!user){
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('eva-profile-name').textContent = user.displayName || user.email || 'Account';
      document.getElementById('eva-profile-email').textContent = user.email || '';
      document.getElementById('eva-profile-photo').src = user.photoURL || DEFAULT_AVATAR;

      try {
        const snap = await getDoc(doc(db, 'users', user.uid));
        const savedRemoteTheme = snap.exists() ? snap.data().theme : null;
        if (savedRemoteTheme === 'light' || savedRemoteTheme === 'dark'){
          applyTheme(savedRemoteTheme);
        }
      } catch (err) {
        console.error('Failed to load theme preference:', err);
      }

      document.body.classList.add('eva-ready');
    });
  </script>
</body>
</html>
