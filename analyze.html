<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Analyze — EVA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B0E14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>

  <template id="eva-page-content">
    <!-- ============================================================
         EVA — ANALYZE PAGE
         PHASE 1: HTML + CSS structure only. No JavaScript logic,
         no Firebase calls, no fake/invented data. Every stat shows
         "—" and every chart/list shows an empty-state placeholder,
         exactly like dashboard.html and journal.html do before their
         JS stage. All containers carry stable IDs so Phase 2 can
         mount real data + ECharts with zero markup changes.
         ============================================================ -->

    <style>
      /* =========================================================
         SCOPE: namespaced "an-", built entirely on the shared
         layout's CSS variables (--eva-bg, --eva-surface, --eva-text,
         --eva-gradient, etc.) so dark/light mode keep working with
         zero extra wiring. Mirrors dashboard.html's "db-" system so
         Analyze visually belongs to the same app.
         ========================================================= */
      .an-wrap{
        --an-radius-lg:20px;
        --an-radius-md:14px;
        --an-radius-sm:10px;
        --an-gap:18px;

        --an-pos:#22C55E;
        --an-pos-bg:rgba(34,197,94,0.12);
        --an-pos-border:rgba(34,197,94,0.35);

        --an-neg:#EF4444;
        --an-neg-bg:rgba(239,68,68,0.12);
        --an-neg-border:rgba(239,68,68,0.35);

        --an-warn:#F59E0B;
        --an-warn-bg:rgba(245,158,11,0.12);
        --an-warn-border:rgba(245,158,11,0.35);

        max-width:1400px;
        margin:0 auto;
        padding-bottom:48px;
        font-family:var(--eva-font-body);
        color:var(--eva-text);
      }
      .an-wrap *{ box-sizing:border-box; min-width:0; }
      .an-wrap h1,.an-wrap h2,.an-wrap h3,.an-wrap p,.an-wrap span,.an-wrap label{ color:inherit; }
      .an-wrap button{ font-family:inherit; cursor:pointer; }
      .an-wrap select,.an-wrap input{ font-family:inherit; }

      .an-section{ margin-bottom:26px; }
      .an-section-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
      .an-section-title{ font-family:var(--eva-font-display); font-size:1rem; font-weight:700; letter-spacing:-0.1px; display:flex; align-items:center; gap:8px; }
      .an-section-title svg{ width:17px; height:17px; stroke:var(--eva-text-dim); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
      .an-section-sub{ font-size:0.78rem; color:var(--eva-text-dim); margin-top:2px; }
      .an-section-super{ font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--eva-accent-2); margin-bottom:4px; }

      .an-card{ background:var(--eva-surface); border:1px solid var(--eva-border); border-radius:var(--an-radius-lg); padding:18px; }
      .an-num{ font-family:var(--eva-font-display); font-weight:700; letter-spacing:-0.4px; font-variant-numeric:tabular-nums; }
      .an-label{ font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--eva-text-dim); }
      .an-pos{ color:var(--an-pos); }
      .an-neg{ color:var(--an-neg); }
      .an-neu{ color:var(--eva-text-dim); }

      .an-grid{ display:grid; gap:var(--an-gap); }
      .an-grid-7{ grid-template-columns:repeat(7,1fr); }
      .an-grid-5{ grid-template-columns:repeat(5,1fr); }
      .an-grid-4{ grid-template-columns:repeat(4,1fr); }
      .an-grid-3{ grid-template-columns:repeat(3,1fr); }
      .an-grid-2{ grid-template-columns:repeat(2,1fr); }
      @media (max-width:1100px){ .an-grid-7{ grid-template-columns:repeat(4,1fr);} .an-grid-5{ grid-template-columns:repeat(3,1fr);} .an-grid-4{ grid-template-columns:repeat(2,1fr);} .an-grid-3{ grid-template-columns:repeat(2,1fr);} }
      @media (max-width:560px){ .an-grid-7,.an-grid-5,.an-grid-4{ grid-template-columns:repeat(2,1fr); gap:10px; } .an-grid-3,.an-grid-2{ grid-template-columns:repeat(2,1fr); gap:10px; } }

      .an-btn{
        display:inline-flex; align-items:center; gap:8px; padding:9px 14px;
        border-radius:var(--an-radius-sm); border:1px solid var(--eva-border);
        background:var(--eva-surface-2); color:var(--eva-text); font-size:0.84rem; font-weight:600;
        transition:background-color .2s var(--eva-ease);
      }
      .an-btn:hover{ background:var(--eva-border); }
      .an-btn svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
      .an-btn-primary{ background:var(--eva-gradient); border:none; color:#fff; }
      .an-btn-primary:hover{ filter:brightness(1.08); }
      .an-btn-icon{ padding:9px; }
      .an-btn:disabled{ opacity:.5; cursor:not-allowed; }

      /* ---------- header ---------- */
      .an-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
      .an-header h1{ font-family:var(--eva-font-display); font-size:1.7rem; font-weight:700; letter-spacing:-0.3px; }
      .an-header p{ font-size:0.9rem; color:var(--eva-text-dim); margin-top:4px; max-width:520px; }
      .an-header-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

      /* ---------- account dropdown (mirrors dashboard's) ---------- */
      .an-account-dropdown{ position:relative; }
      .an-account-trigger{
        display:flex; align-items:center; gap:12px; padding:10px 14px 10px 12px;
        border-radius:var(--an-radius-md); border:1px solid var(--eva-border); background:var(--eva-surface);
        min-width:220px; max-width:280px; transition:border-color .2s var(--eva-ease), background-color .2s var(--eva-ease);
      }
      .an-account-trigger:hover{ background:var(--eva-surface-2); }
      .an-account-trigger.an-open{ border-color:var(--eva-accent-1); }
      .an-account-trigger-icon{ width:34px; height:34px; border-radius:10px; background:var(--eva-gradient); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
      .an-account-trigger-icon svg{ width:16px; height:16px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
      .an-account-trigger-info{ display:flex; flex-direction:column; align-items:flex-start; min-width:0; flex:1; }
      .an-account-trigger-name{ font-size:0.84rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px; }
      .an-account-trigger-meta{ font-size:0.72rem; color:var(--eva-text-dim); white-space:nowrap; }
      .an-account-trigger-chevron{ width:15px; height:15px; stroke:var(--eva-text-dim); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; transition:transform .2s var(--eva-ease); }
      .an-account-trigger.an-open .an-account-trigger-chevron{ transform:rotate(180deg); }

      .an-account-panel{
        position:fixed; visibility:hidden; opacity:0; pointer-events:none;
        width:300px; max-width:92vw;
        background:var(--eva-surface); border:1px solid var(--eva-border); border-radius:var(--an-radius-md);
        box-shadow:var(--eva-shadow); z-index:960; overflow:hidden;
        display:flex; flex-direction:column;
        transition:opacity .16s var(--eva-ease);
      }
      .an-account-panel.an-open{ visibility:visible; opacity:1; pointer-events:auto; }
      .an-account-panel-header{ padding:12px 14px 8px; font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--eva-text-dim); }
      .an-account-list{ overflow-y:auto; max-height:280px; padding:0 6px 6px; }
      .an-account-item{
        display:flex; align-items:center; gap:10px; width:100%; padding:9px 8px; border-radius:10px;
        background:none; border:none; text-align:left; color:var(--eva-text);
      }
      .an-account-item:hover{ background:var(--eva-surface-2); }
      .an-account-item.an-active{ background:var(--eva-surface-2); }
      .an-account-item-dot{ width:8px; height:8px; border-radius:50%; background:var(--an-pos); flex-shrink:0; }
      .an-account-item-info{ display:flex; flex-direction:column; min-width:0; flex:1; }
      .an-account-item-name{ font-size:0.85rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .an-account-item-meta{ font-size:0.72rem; color:var(--eva-text-dim); display:flex; gap:6px; }
      .an-account-item-check{ width:15px; height:15px; stroke:var(--eva-accent-1); fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
      .an-account-backdrop{ position:fixed; inset:0; z-index:955; display:none; }
      .an-account-backdrop.an-open{ display:block; }

      /* ---------- pill switches (date range / timeframe) ---------- */
      .an-filter-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
      .an-pill-switch{ display:inline-flex; padding:3px; border-radius:999px; background:var(--eva-surface-2); border:1px solid var(--eva-border); gap:2px; flex-wrap:wrap; }
      .an-pill-switch button{ padding:6px 13px; border-radius:999px; border:none; background:none; color:var(--eva-text-dim); font-size:0.78rem; font-weight:600; }
      .an-pill-switch button.an-active{ background:var(--eva-gradient); color:#fff; }

      /* ---------- overall performance summary strip ---------- */
      .an-summary-strip{ display:flex; flex-wrap:wrap; gap:22px; padding:14px 18px; }
      .an-summary-item{ display:flex; flex-direction:column; gap:3px; }
      .an-summary-item .an-num{ font-size:1.05rem; }

      /* ---------- KPI stat cards ---------- */
      .an-stat-card{ display:flex; flex-direction:column; gap:8px; }
      .an-stat-top{ display:flex; align-items:center; justify-content:space-between; }
      .an-stat-icon{ width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; background:var(--eva-surface-2); color:var(--eva-text-dim); flex-shrink:0; }
      .an-stat-icon svg{ width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2; }
      .an-stat-value{ font-size:1.35rem; }
      @media (max-width:560px){ .an-stat-value{ font-size:1.05rem; } }

      /* ---------- chart cards ---------- */
      .an-chart-card{ padding-bottom:8px; }
      .an-chart-canvas{ width:100%; height:280px; position:relative; }
      .an-chart-canvas.an-chart-md{ height:220px; }
      .an-chart-canvas.an-chart-sm{ height:160px; }
      .an-chart-empty{
        position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
        gap:8px; color:var(--eva-text-dim); font-size:0.82rem; text-align:center; padding:0 20px;
      }
      .an-chart-empty svg{ width:30px; height:30px; stroke:var(--eva-text-dim); fill:none; stroke-width:1.6; }
      .an-charts-grid{ display:grid; grid-template-columns:1fr 1fr; gap:var(--an-gap); }
      .an-charts-grid-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:var(--an-gap); }
      @media (max-width:900px){ .an-charts-grid,.an-charts-grid-3{ grid-template-columns:1fr; } }
      .an-chart-toolbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
      .an-icon-controls{ display:flex; gap:6px; }

      /* ---------- insight / highlight cards (best/worst, edge, improve) ---------- */
      .an-insight-card{
        display:flex; flex-direction:column; gap:10px; position:relative; overflow:hidden;
      }
      .an-insight-card.an-insight-pos{ border-color:var(--an-pos-border); }
      .an-insight-card.an-insight-neg{ border-color:var(--an-neg-border); }
      .an-insight-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
      .an-insight-icon{ width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
      .an-insight-icon svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
      .an-insight-icon.an-ic-pos{ background:var(--an-pos-bg); color:var(--an-pos); }
      .an-insight-icon.an-ic-neg{ background:var(--an-neg-bg); color:var(--an-neg); }
      .an-insight-icon.an-ic-neu{ background:var(--eva-surface-2); color:var(--eva-text-dim); }
      .an-insight-name{ font-family:var(--eva-font-display); font-weight:700; font-size:1rem; margin-top:2px; }
      .an-insight-meta{ font-size:0.76rem; color:var(--eva-text-dim); display:flex; flex-wrap:wrap; gap:5px 10px; }

      /* ---------- category breakdown cards (strategy/setup/session/etc.) ---------- */
      .an-cat-list{ display:flex; flex-direction:column; gap:10px; }
      .an-cat-card{
        display:flex; align-items:center; gap:14px; padding:13px 14px;
        border:1px solid var(--eva-border); border-radius:var(--an-radius-md); background:var(--eva-surface-2);
      }
      .an-cat-rank{ width:26px; height:26px; border-radius:8px; background:var(--eva-surface); border:1px solid var(--eva-border); display:flex; align-items:center; justify-content:center; font-size:0.72rem; font-weight:800; color:var(--eva-text-dim); flex-shrink:0; }
      .an-cat-info{ flex:1; min-width:0; }
      .an-cat-name{ font-size:0.9rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .an-cat-bar-track{ height:6px; border-radius:999px; background:var(--eva-border); margin-top:7px; overflow:hidden; }
      .an-cat-bar-fill{ height:100%; border-radius:999px; background:var(--eva-gradient); width:0%; }
      .an-cat-stats{ display:flex; gap:16px; flex-shrink:0; }
      .an-cat-stat{ display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
      .an-cat-stat .an-num{ font-size:0.86rem; }
      .an-cat-stat .an-label{ font-size:0.6rem; }
      @media (max-width:640px){ .an-cat-card{ flex-wrap:wrap; } .an-cat-stats{ width:100%; justify-content:space-between; margin-top:6px; } }

      .an-list-empty{
        display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
        padding:34px 18px; color:var(--eva-text-dim); font-size:0.84rem; text-align:center;
        border:1px dashed var(--eva-border); border-radius:var(--an-radius-md);
      }
      .an-list-empty svg{ width:26px; height:26px; stroke:var(--eva-text-dim); fill:none; stroke-width:1.6; }

      /* ---------- fixed-category cards: session / day / grade / condition / emotion ---------- */
      .an-fixed-card{ display:flex; flex-direction:column; gap:10px; }
      .an-fixed-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
      .an-fixed-name{ font-family:var(--eva-font-display); font-weight:700; font-size:0.92rem; }
      .an-fixed-badge{ width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; background:var(--eva-surface-2); color:var(--eva-text-dim); font-size:0.72rem; font-weight:800; flex-shrink:0; }
      .an-fixed-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
      .an-fixed-stat{ display:flex; flex-direction:column; gap:2px; }
      .an-fixed-stat .an-num{ font-size:0.92rem; }

      /* ---------- long vs short / win vs loss comparisons ---------- */
      .an-vs-wrap{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px; }
      @media (max-width:640px){ .an-vs-wrap{ grid-template-columns:1fr; } .an-vs-divider{ display:none; } }
      .an-vs-side{ display:flex; flex-direction:column; gap:12px; }
      .an-vs-divider{ width:1px; align-self:stretch; background:var(--eva-border); }
      .an-vs-head{ display:flex; align-items:center; gap:8px; }
      .an-vs-dot{ width:9px; height:9px; border-radius:50%; }
      .an-vs-dot.an-vs-long{ background:var(--an-pos); }
      .an-vs-dot.an-vs-short{ background:var(--an-neg); }
      .an-vs-title{ font-weight:700; font-size:0.9rem; }
      .an-vs-stats{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
      .an-vs-stat{ background:var(--eva-surface-2); border:1px solid var(--eva-border); border-radius:var(--an-radius-sm); padding:10px; }

      /* ---------- mistakes / discipline checklist cards ---------- */
      .an-mistake-card{ display:flex; align-items:center; gap:12px; padding:13px 14px; border:1px solid var(--eva-border); border-radius:var(--an-radius-md); background:var(--eva-surface-2); }
      .an-mistake-icon{ width:36px; height:36px; border-radius:10px; background:var(--an-warn-bg); color:var(--an-warn); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
      .an-mistake-icon svg{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
      .an-mistake-info{ flex:1; min-width:0; }
      .an-mistake-name{ font-size:0.86rem; font-weight:700; }
      .an-mistake-desc{ font-size:0.72rem; color:var(--eva-text-dim); margin-top:2px; }
      .an-mistake-count{ text-align:right; flex-shrink:0; }

      /* ---------- edge / improvement gradient callout cards ---------- */
      .an-edge-card{
        border-radius:var(--an-radius-lg); padding:18px; position:relative; overflow:hidden;
        background:var(--eva-surface); border:1px solid var(--eva-border);
      }
      .an-edge-card::before{
        content:''; position:absolute; inset:0; opacity:0.07; background:var(--eva-gradient); pointer-events:none;
      }
      .an-edge-card.an-improve-card::before{ background:linear-gradient(135deg, var(--an-neg) 0%, var(--an-warn) 100%); }
      .an-edge-label{ display:flex; align-items:center; gap:8px; font-size:0.68rem; font-weight:800; text-transform:uppercase; letter-spacing:0.06em; color:var(--eva-text-dim); margin-bottom:8px; }
      .an-edge-value{ font-family:var(--eva-font-display); font-weight:700; font-size:1.05rem; }
      .an-edge-sub{ font-size:0.76rem; color:var(--eva-text-dim); margin-top:4px; }

      .an-banner{
        display:flex; align-items:center; gap:14px; padding:18px 20px; border-radius:var(--an-radius-lg);
        background:var(--eva-gradient); color:#fff; margin-bottom:16px;
      }
      .an-banner.an-banner-improve{ background:linear-gradient(135deg, var(--an-neg) 0%, var(--an-warn) 100%); }
      .an-banner-icon{ width:40px; height:40px; border-radius:12px; background:rgba(255,255,255,0.18); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
      .an-banner-icon svg{ width:20px; height:20px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
      .an-banner h2{ font-family:var(--eva-font-display); font-size:1.05rem; font-weight:700; }
      .an-banner p{ font-size:0.8rem; opacity:0.92; margin-top:2px; }

      /* ---------- filter panel ---------- */
      .an-adv-filters{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
      @media (max-width:1100px){ .an-adv-filters{ grid-template-columns:repeat(3,1fr); } }
      @media (max-width:900px){ .an-adv-filters{ grid-template-columns:repeat(2,1fr); } }
      @media (max-width:560px){ .an-adv-filters{ grid-template-columns:1fr; } }
      .an-field{ display:flex; flex-direction:column; gap:5px; }
      .an-field label{ font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--eva-text-dim); }
      .an-field select,.an-field input{ width:100%; padding:9px 10px; border-radius:var(--an-radius-sm); background:var(--eva-surface); border:1px solid var(--eva-border); color:var(--eva-text); font-size:0.82rem; }
      .an-filter-actions{ display:flex; align-items:center; justify-content:flex-end; gap:10px; margin-top:14px; flex-wrap:wrap; }

      /* ---------- loading ---------- */
      .an-loading-row{ display:flex; align-items:center; gap:8px; color:var(--eva-text-dim); font-size:0.84rem; padding:20px; justify-content:center; }
      .an-spin{ width:16px; height:16px; border-radius:50%; border:2px solid var(--eva-border); border-top-color:var(--eva-accent-1); animation:an-spin .7s linear infinite; }
      @keyframes an-spin{ to{ transform:rotate(360deg); } }

      [hidden]{ display:none !important; }
      /* =================================================================
         COLOR-ONLY OVERLAY — adds a colorful palette across cards, card
         borders, and stat/P&L numbers. No layout, spacing, markup, or
         JS is touched by this block; it only changes color/background/
         border-color/text-color properties on the classes already in
         the page above.
         ================================================================= */

      :root{
        --an-c1:#8B5CF6;   /* violet   */ --an-c1-bg:rgba(139,92,246,0.14);  --an-c1-border:rgba(139,92,246,0.4);
        --an-c2:#3B82F6;   /* blue     */ --an-c2-bg:rgba(59,130,246,0.14);  --an-c2-border:rgba(59,130,246,0.4);
        --an-c3:#06B6D4;   /* cyan     */ --an-c3-bg:rgba(6,182,212,0.14);   --an-c3-border:rgba(6,182,212,0.4);
        --an-c4:#14B8A6;   /* teal     */ --an-c4-bg:rgba(20,184,166,0.14);  --an-c4-border:rgba(20,184,166,0.4);
        --an-c5:#F59E0B;   /* amber    */ --an-c5-bg:rgba(245,158,11,0.14);  --an-c5-border:rgba(245,158,11,0.4);
        --an-c6:#EC4899;   /* pink     */ --an-c6-bg:rgba(236,72,153,0.14);  --an-c6-border:rgba(236,72,153,0.4);
        --an-c7:#6366F1;   /* indigo   */ --an-c7-bg:rgba(99,102,241,0.14);  --an-c7-border:rgba(99,102,241,0.4);
        --an-c8:#F97316;   /* orange   */ --an-c8-bg:rgba(249,115,22,0.14);  --an-c8-border:rgba(249,115,22,0.4);

      /* ---------- every card gets a colorful top accent + tinted border ---------- */

      .an-grid > .an-card:nth-of-type(8n+1){ border-color:var(--an-c1-border); }
      .an-grid > .an-card:nth-of-type(8n+2){ border-color:var(--an-c2-border); }
      .an-grid > .an-card:nth-of-type(8n+3){ border-color:var(--an-c3-border); }
      .an-grid > .an-card:nth-of-type(8n+4){ border-color:var(--an-c4-border); }
      .an-grid > .an-card:nth-of-type(8n+5){ border-color:var(--an-c5-border); }

      #an-kpi-overview .an-stat-card:nth-of-type(8n+4) .an-stat-value{ color:var(--an-c4); }
      #an-kpi-overview .an-stat-card:nth-of-type(8n+5) .an-stat-value{ color:var(--an-c5); }
      #an-kpi-overview .an-stat-card:nth-of-type(8n+6) .an-stat-value{ color:var(--an-c6); }
      #an-kpi-overview .an-stat-card:nth-of-type(8n+7) .an-stat-value{ color:var(--an-c7); }
      #an-kpi-overview .an-stat-card:nth-of-type(8n+8) .an-stat-value{ color:var(--an-c8); }

      .an-neg{ color:var(--an-neg); text-shadow:0 0 14px rgba(239,68,68,0.25); }

      #an-session-grid .an-fixed-card:nth-of-type(3){ background:var(--an-c1-bg); border-color:var(--an-c1-border); }
      #an-session-grid .an-fixed-card:nth-of-type(3) .an-fixed-badge{ background:var(--an-c1); color:#fff; }
      #an-session-grid .an-fixed-card:nth-of-type(4){ background:var(--an-c6-bg); border-color:var(--an-c6-border); }
      #an-session-grid .an-fixed-card:nth-of-type(4) .an-fixed-badge{ background:var(--an-c6); color:#fff; }

      #an-day-analysis .an-fixed-card:nth-of-type(1){ border-color:var(--an-c1-border); }
      #an-day-analysis .an-fixed-card:nth-of-type(1) .an-fixed-name{ color:var(--an-c1); }
      #an-day-analysis .an-fixed-card:nth-of-type(2){ border-color:var(--an-c2-border); }
      #an-day-analysis .an-fixed-card:nth-of-type(2) .an-fixed-name{ color:var(--an-c2); }
      #an-day-analysis .an-fixed-card:nth-of-type(3){ border-color:var(--an-c4-border); }

      #an-grade-grid .an-fixed-card:nth-of-type(3){ background:var(--an-c5-bg); border-color:var(--an-c5-border); }
      #an-grade-grid .an-fixed-card:nth-of-type(3) .an-fixed-badge{ background:var(--an-c5); color:#fff; }
      #an-grade-grid .an-fixed-card:nth-of-type(4){ background:var(--an-neg-bg); border-color:var(--an-neg-border); }

      #an-emotion-grid .an-fixed-card:nth-of-type(8n+3){ border-color:var(--an-c6-border); }
      #an-emotion-grid .an-fixed-card:nth-of-type(8n+4){ border-color:var(--an-c5-border); }
      #an-emotion-grid .an-fixed-card:nth-of-type(8n+5){ border-color:var(--an-neg-border); }
      #an-emotion-grid .an-fixed-card:nth-of-type(8n+6){ border-color:var(--an-c7-border); }
      #an-emotion-grid .an-fixed-card:nth-of-type(8n+7){ border-color:var(--an-c3-border); }

      .an-edge-card:nth-of-type(7n+1){ border-color:var(--an-c1-border); } .an-edge-card:nth-of-type(7n+1) .an-edge-value{ color:var(--an-c1); }
      .an-edge-card:nth-of-type(7n+2){ border-color:var(--an-c2-border); } .an-edge-card:nth-of-type(7n+2) .an-edge-value{ color:var(--an-c2); }
      .an-edge-card:nth-of-type(7n+3){ border-color:var(--an-c3-border); } .an-edge-card:nth-of-type(7n+3) .an-edge-value{ color:var(--an-c3); }
      .an-edge-card:nth-of-type(7n+4){ border-color:var(--an-c4-border); } .an-edge-card:nth-of-type(7n+4) .an-edge-value{ color:var(--an-c4); }
      .an-edge-card:nth-of-type(7n+5){ border-color:var(--an-c5-border); } .an-edge-card:nth-of-type(7n+5) .an-edge-value{ color:var(--an-c5); }

      .an-mistake-card:nth-of-type(11n+1) .an-mistake-icon{ background:var(--an-c8-bg); color:var(--an-c8); }
