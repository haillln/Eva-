<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>challenge — EVA</title>
  <!-- Apache ECharts powers every chart on the Challenge page. Loaded as a
       classic (non-module) script so it is available on window.echarts
       before challenge.js (a deferred module script) executes. -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B0E14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>

  <template id="eva-page-content">
    <!-- ============================================================
         EVA — FUNDED CHALLENGE COMMAND CENTER
         Stage 1: HTML + CSS structure only. No JavaScript logic,
         no Firebase calls. All values below are demo/placeholder
         content only, structured with predictable IDs/classes so
         a later JS/Firebase stage can populate everything without
         touching this markup.
         ============================================================ -->

    <style>
      /* =========================================================
         SCOPE: everything below is namespaced with "ch-" and only
         reuses the CSS custom properties already defined by the
         shared layout (--eva-bg, --eva-surface, --eva-text, etc.)
         so dark/light mode and the existing theme system keep
         working with zero extra wiring.
         ========================================================= */
      .ch-wrap{
        --ch-radius-lg:20px;
        --ch-radius-md:14px;
        --ch-radius-sm:10px;
        --ch-gap:18px;

        --ch-safe:#22C55E;
        --ch-safe-bg:rgba(34,197,94,0.12);
        --ch-safe-border:rgba(34,197,94,0.35);

        --ch-warn:#F59E0B;
        --ch-warn-bg:rgba(245,158,11,0.12);
        --ch-warn-border:rgba(245,158,11,0.35);

        --ch-danger:#EF4444;
        --ch-danger-bg:rgba(239,68,68,0.12);
        --ch-danger-border:rgba(239,68,68,0.35);

        --ch-info:var(--eva-accent-1);
        --ch-info-bg:color-mix(in srgb, var(--eva-accent-1) 12%, transparent);
        --ch-info-border:color-mix(in srgb, var(--eva-accent-1) 35%, transparent);

        max-width:1400px;
        margin:0 auto;
        padding-bottom:48px;
        font-family:var(--eva-font-body);
        color:var(--eva-text);
      }
      .ch-wrap *{ box-sizing:border-box; }
      .ch-wrap h1,.ch-wrap h2,.ch-wrap h3,.ch-wrap p,.ch-wrap span,.ch-wrap label{ color:inherit; }
      .ch-wrap button{ font-family:inherit; cursor:pointer; }
      .ch-wrap select,.ch-wrap input{ font-family:inherit; }

      .ch-section{ margin-bottom:22px; }
      .ch-section-head{
        display:flex; align-items:center; justify-content:space-between;
        gap:12px; margin-bottom:12px; flex-wrap:wrap;
      }
      .ch-section-title{
        font-family:var(--eva-font-display);
        font-size:1rem; font-weight:700; letter-spacing:-0.1px;
        display:flex; align-items:center; gap:8px;
      }
      .ch-section-title svg{ width:17px; height:17px; stroke:var(--eva-text-dim); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
      .ch-section-sub{ font-size:0.78rem; color:var(--eva-text-dim); margin-top:2px; }

      .ch-card{
        background:var(--eva-surface);
        border:1px solid var(--eva-border);
        border-radius:var(--ch-radius-lg);
        padding:18px;
      }

      /* numbers dominate visually per the hierarchy spec */
      .ch-num{ font-family:var(--eva-font-display); font-weight:700; letter-spacing:-0.4px; font-variant-numeric:tabular-nums; }
      .ch-label{ font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--eva-text-dim); }

      .ch-pill{
        display:inline-flex; align-items:center; gap:5px;
        padding:3px 10px; border-radius:999px;
        font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
        border:1px solid transparent;
      }
      .ch-pill-dot{ width:6px; height:6px; border-radius:50%; background:currentColor; flex-shrink:0; }
      .ch-pill-safe{ background:var(--ch-safe-bg); color:var(--ch-safe); border-color:var(--ch-safe-border); }
      .ch-pill-warn{ background:var(--ch-warn-bg); color:var(--ch-warn); border-color:var(--ch-warn-border); }
      .ch-pill-danger{ background:var(--ch-danger-bg); color:var(--ch-danger); border-color:var(--ch-danger-border); }
      .ch-pill-info{ background:var(--ch-info-bg); color:var(--ch-info); border-color:var(--ch-info-border); }
      .ch-pill-neutral{ background:var(--eva-surface-2); color:var(--eva-text-dim); border-color:var(--eva-border); }

      /* controlled glow — strategic, not everywhere */
      .ch-glow-safe{ box-shadow:0 0 0 1px var(--ch-safe-border), 0 0 22px -6px rgba(34,197,94,0.45); }
      .ch-glow-warn{ box-shadow:0 0 0 1px var(--ch-warn-border), 0 0 22px -6px rgba(245,158,11,0.5); }
      .ch-glow-danger{ box-shadow:0 0 0 1px var(--ch-danger-border), 0 0 26px -6px rgba(239,68,68,0.55); }
      .ch-glow-info{ box-shadow:0 0 0 1px var(--ch-info-border), 0 0 22px -6px color-mix(in srgb, var(--eva-accent-1) 55%, transparent); }

      .ch-bar-track{
        width:100%; height:8px; border-radius:999px;
        background:var(--eva-surface-2); overflow:hidden; position:relative;
      }
      .ch-bar-fill{
        height:100%; border-radius:999px;
        background:linear-gradient(90deg, var(--eva-accent-1), var(--eva-accent-2));
        transition:width .4s var(--eva-ease);
      }
      .ch-bar-fill.ch-fill-safe{ background:linear-gradient(90deg, #16A34A, var(--ch-safe)); }
      .ch-bar-fill.ch-fill-warn{ background:linear-gradient(90deg, #D97706, var(--ch-warn)); }
      .ch-bar-fill.ch-fill-danger{ background:linear-gradient(90deg, #DC2626, var(--ch-danger)); }

      .ch-grid{ display:grid; gap:var(--ch-gap); }
      .ch-grid-4{ grid-template-columns:repeat(4,1fr); }
      .ch-grid-3{ grid-template-columns:repeat(3,1fr); }
      .ch-grid-2{ grid-template-columns:repeat(2,1fr); }
      @media (max-width:1100px){ .ch-grid-4{ grid-template-columns:repeat(2,1fr); } .ch-grid-3{ grid-template-columns:repeat(2,1fr);} }
      @media (max-width:640px){ .ch-grid-4,.ch-grid-3,.ch-grid-2{ grid-template-columns:1fr; } }

      .ch-btn{
        display:inline-flex; align-items:center; gap:7px;
        padding:9px 14px; border-radius:var(--ch-radius-sm);
        background:var(--eva-surface-2); border:1px solid var(--eva-border);
        color:var(--eva-text); font-size:0.82rem; font-weight:600;
        transition:background-color .15s var(--eva-ease), border-color .15s var(--eva-ease);
      }
      .ch-btn:hover{ background:color-mix(in srgb, var(--eva-accent-1) 10%, var(--eva-surface-2)); border-color:var(--eva-info-border); }
      .ch-btn svg{ width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; }
      .ch-btn-icon{ width:36px; height:36px; padding:0; justify-content:center; }
      .ch-btn-primary{ background:var(--eva-gradient); border:none; color:#fff; }
      .ch-btn-danger{ background:var(--ch-danger-bg); border:1px solid var(--ch-danger-border); color:var(--ch-danger); }
      .ch-btn-danger:hover{ background:var(--ch-danger); color:#fff; }
      .ch-account-panel-actions{ display:flex; gap:8px; margin-top:8px; }
      .ch-account-panel-actions .ch-btn{ flex:1; justify-content:center; font-size:0.78rem; padding:8px 10px; }
      .ch-delete-warning{
        display:flex; flex-direction:column; gap:4px; padding:14px; border-radius:var(--ch-radius-md);
        background:var(--ch-danger-bg); border:1px solid var(--ch-danger-border); color:var(--eva-text);
      }
      .ch-delete-warning b{ color:var(--ch-danger); }
      .ch-day-trade-row{
        display:flex; align-items:center; justify-content:space-between; gap:10px;
        padding:10px 12px; border-radius:var(--ch-radius-sm); background:var(--eva-surface-2); border:1px solid var(--eva-border);
      }

      .ch-empty{
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        gap:8px; padding:34px 18px; text-align:center; color:var(--eva-text-dim);
        border:1px dashed var(--eva-border); border-radius:var(--ch-radius-md);
      }
      .ch-empty svg{ width:26px; height:26px; stroke:var(--eva-text-dim); fill:none; stroke-width:1.6; }
      .ch-empty strong{ color:var(--eva-text); font-size:0.86rem; font-weight:600; }
      .ch-empty span{ font-size:0.78rem; }

      .ch-skel{ position:relative; overflow:hidden; background:var(--eva-surface-2); border-radius:8px; }
      .ch-skel::after{
        content:""; position:absolute; inset:0;
        background:linear-gradient(90deg, transparent, color-mix(in srgb, var(--eva-text) 8%, transparent), transparent);
        animation:ch-shimmer 1.4s infinite;
      }
      @keyframes ch-shimmer{ 0%{ transform:translateX(-100%);} 100%{ transform:translateX(100%);} }

      .ch-error{
        display:flex; align-items:center; gap:12px; padding:16px;
        border-radius:var(--ch-radius-md); background:var(--ch-danger-bg);
        border:1px solid var(--ch-danger-border); color:var(--ch-danger);
        font-size:0.85rem; font-weight:600;
      }
      .ch-error svg{ width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; flex-shrink:0; }
      .ch-error-actions{ margin-left:auto; }
      .ch-error-actions button{ color:var(--ch-danger); border-color:var(--ch-danger-border); background:transparent; }

      /* ---------------------------------------------------------
         1. HEADER + ACCOUNT SELECTOR
         --------------------------------------------------------- */
      .ch-header{
        display:flex; align-items:flex-start; justify-content:space-between;
        gap:16px; flex-wrap:wrap; margin-bottom:20px;
      }
      .ch-header h1{
        font-family:var(--eva-font-display); font-size:1.7rem; font-weight:700; letter-spacing:-0.3px;
      }
      .ch-header p{ color:var(--eva-text-dim); font-size:0.9rem; margin-top:4px; }

      .ch-account-dropdown{ position:relative; }
      .ch-account-trigger{
        display:flex; align-items:center; gap:12px;
        background:var(--eva-surface); border:1px solid var(--eva-border);
        border-radius:var(--ch-radius-md); padding:10px 14px 10px 12px;
        min-width:230px; cursor:pointer;
        transition:border-color .2s var(--eva-ease), background-color .2s var(--eva-ease);
      }
      .ch-account-trigger:hover{ background:var(--eva-surface-2); }
      .ch-account-trigger.ch-open{ border-color:var(--eva-accent-1); }
      .ch-account-trigger-icon{
        width:34px; height:34px; border-radius:10px; flex-shrink:0;
        display:flex; align-items:center; justify-content:center;
        background:var(--eva-gradient); color:#fff;
      }
      .ch-account-trigger-icon svg{ width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:2; }
      .ch-account-trigger-info{ flex:1; min-width:0; }
      .ch-account-trigger-name{ font-size:0.86rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .ch-account-trigger-meta{ font-size:0.72rem; color:var(--eva-text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .ch-account-trigger-chevron{ width:16px; height:16px; stroke:var(--eva-text-dim); fill:none; stroke-width:2; flex-shrink:0; transition:transform .2s var(--eva-ease); }
      .ch-account-trigger.ch-open .ch-account-trigger-chevron{ transform:rotate(180deg); }

      .ch-account-panel{
        position:absolute; top:calc(100% + 8px); right:0; left:auto;
        min-width:300px; max-width:340px; max-height:380px; overflow-y:auto;
        background:var(--eva-surface); border:1px solid var(--eva-border);
        border-radius:var(--ch-radius-md); box-shadow:0 16px 40px rgba(0,0,0,0.35);
        z-index:60; display:none;
      }
      .ch-account-panel.ch-open{ display:block; }
      .ch-account-panel-header{
        padding:12px 16px 8px; font-size:0.72rem; font-weight:700; text-transform:uppercase;
        letter-spacing:0.06em; color:var(--eva-text-dim); border-bottom:1px solid var(--eva-border);
      }
      .ch-account-list{ padding:6px; display:flex; flex-direction:column; gap:2px; }
      .ch-account-panel-footer{ padding:8px; border-top:1px solid var(--eva-border); }
      .ch-account-item{
        display:flex; align-items:center; gap:10px; width:100%; text-align:left;
        background:transparent; border:none; border-radius:var(--ch-radius-sm);
        padding:10px; transition:background-color .15s var(--eva-ease);
      }
      .ch-account-item:hover{ background:var(--eva-surface-2); }
      .ch-account-item.ch-active{ background:color-mix(in srgb, var(--eva-accent-1) 12%, transparent); }
      .ch-account-item-info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
      .ch-account-item-name{ font-size:0.86rem; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .ch-account-item-meta{ font-size:0.74rem; color:var(--eva-text-dim); }

      /* ---------------------------------------------------------
         2. CHALLENGE STATUS BANNER
         --------------------------------------------------------- */
      .ch-status-banner{
        display:flex; align-items:center; gap:14px; flex-wrap:wrap;
        padding:16px 18px; border-radius:var(--ch-radius-lg);
        background:var(--eva-surface); border:1px solid var(--eva-border);
      }
      .ch-status-banner.ch-glow-safe,.ch-status-banner.ch-glow-warn,.ch-status-banner.ch-glow-danger,.ch-status-banner.ch-glow-info{ border-color:transparent; }
      .ch-status-icon{
        width:44px; height:44px; border-radius:13px; flex-shrink:0;
        display:flex; align-items:center; justify-content:center;
      }
      .ch-status-icon svg{ width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
      .ch-status-safe .ch-status-icon{ background:var(--ch-safe-bg); color:var(--ch-safe); }
      .ch-status-warn .ch-status-icon{ background:var(--ch-warn-bg); color:var(--ch-warn); }
      .ch-status-danger .ch-status-icon{ background:var(--ch-danger-bg); color:var(--ch-danger); }
      .ch-status-info .ch-status-icon{ background:var(--ch-info-bg); color:var(--ch-info); }
      .ch-status-body{ flex:1; min-width:200px; }
      .ch-status-title{ font-family:var(--eva-font-display); font-size:1.05rem; font-weight:700; }
      .ch-status-desc{ font-size:0.82rem; color:var(--eva-text-dim); margin-top:2px; }
      .ch-status-meta{ display:flex; gap:22px; flex-wrap:wrap; }
      .ch-status-meta-item{ text-align:right; }
      .ch-status-meta-item .ch-num{ font-size:1.1rem; display:block; }
      .ch-status-meta-item .ch-label{ font-size:0.66rem; }

      /* ---------------------------------------------------------
         3. ACCOUNT OVERVIEW METRIC CARDS
         --------------------------------------------------------- */
      .ch-metric-card{ display:flex; flex-direction:column; gap:10px; }
      .ch-metric-top{ display:flex; align-items:center; justify-content:space-between; }
      .ch-metric-icon{ width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; background:var(--eva-surface-2); color:var(--eva-text-dim); }
      .ch-metric-icon svg{ width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2; }
      .ch-metric-value{ font-size:1.55rem; line-height:1.1; }
      .ch-metric-value.ch-pos{ color:var(--ch-safe); }
      .ch-metric-value.ch-neg{ color:var(--ch-danger); }
      .ch-metric-foot{ font-size:0.76rem; color:var(--eva-text-dim); display:flex; align-items:center; gap:6px; }
      .ch-metric-foot.ch-pos{ color:var(--ch-safe); }
      .ch-metric-foot.ch-neg{ color:var(--ch-danger); }

      /* ---------------------------------------------------------
         4. PHASE PROGRESSION
         --------------------------------------------------------- */
      .ch-phase-track{ display:flex; gap:14px; align-items:stretch; overflow-x:auto; padding-bottom:4px; }
      .ch-phase-node{
        flex:1; min-width:200px; padding:16px; border-radius:var(--ch-radius-md);
        background:var(--eva-surface-2); border:1px solid var(--eva-border);
        display:flex; flex-direction:column; gap:10px; position:relative;
      }
      .ch-phase-node.ch-phase-active{ background:var(--ch-info-bg); border-color:var(--ch-info-border); }
      .ch-phase-node.ch-phase-passed{ background:var(--ch-safe-bg); border-color:var(--ch-safe-border); }
      .ch-phase-node.ch-phase-locked{ opacity:0.55; }
      .ch-phase-node-head{ display:flex; align-items:center; justify-content:space-between; }
      .ch-phase-node-name{ font-family:var(--eva-font-display); font-weight:700; font-size:0.88rem; }
      .ch-phase-node-icon{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
      .ch-phase-node-icon svg{ width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2.4; stroke-linecap:round; }
      .ch-phase-passed .ch-phase-node-icon{ background:var(--ch-safe); color:#fff; }
      .ch-phase-active .ch-phase-node-icon{ background:var(--eva-gradient); color:#fff; }
      .ch-phase-locked .ch-phase-node-icon{ background:var(--eva-surface); color:var(--eva-text-dim); }
      .ch-phase-node-stat{ font-size:0.76rem; color:var(--eva-text-dim); display:flex; justify-content:space-between; }
      .ch-phase-node-stat b{ color:var(--eva-text); font-weight:700; }
      .ch-phase-connector{ width:20px; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:var(--eva-text-dim); }
      .ch-phase-connector svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; }
      @media (max-width:900px){ .ch-phase-track{ flex-direction:column; } .ch-phase-connector{ width:auto; height:16px; transform:rotate(90deg); } }

      /* ---------------------------------------------------------
         5. DRAWDOWN + DANGER ZONE
         --------------------------------------------------------- */
      .ch-dd-card{ display:flex; flex-direction:column; gap:12px; }
      .ch-dd-row{ display:flex; justify-content:space-between; align-items:baseline; }
      .ch-dd-used{ font-size:0.82rem; color:var(--eva-text-dim); }
      .ch-dd-used b{ color:var(--eva-text); font-weight:700; }
      .ch-dd-remaining{ display:flex; justify-content:space-between; align-items:center; font-size:0.78rem; color:var(--eva-text-dim); }
      .ch-dd-remaining .ch-num{ font-size:0.95rem; color:var(--eva-text); }

      .ch-danger-panel{
        display:flex; flex-direction:column; align-items:center; text-align:center;
        gap:6px; padding:26px 18px;
      }
      .ch-danger-ring{ position:relative; width:150px; height:150px; margin-bottom:6px; }
      .ch-danger-ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
      .ch-danger-ring-track{ fill:none; stroke:var(--eva-surface-2); stroke-width:10; }
      .ch-danger-ring-fill{ fill:none; stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset .5s var(--eva-ease), stroke .3s; }
      .ch-danger-ring-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
      .ch-danger-ring-center .ch-num{ font-size:2rem; }
      .ch-danger-ring-center span{ font-size:0.66rem; color:var(--eva-text-dim); text-transform:uppercase; letter-spacing:0.05em; font-weight:700; max-width:100px; }
      .ch-danger-breach-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; margin-top:14px; }
      .ch-danger-breach-item{ background:var(--eva-surface-2); border-radius:var(--ch-radius-sm); padding:10px; text-align:left; }
      .ch-danger-breach-item .ch-num{ font-size:1rem; }

      /* ---------------------------------------------------------
         6. RISK ENGINE + NEXT TRADE
         --------------------------------------------------------- */
      .ch-risk-list{ display:flex; flex-direction:column; gap:0; }
      .ch-risk-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--eva-border); font-size:0.84rem; }
      .ch-risk-row:last-child{ border-bottom:none; }
      .ch-risk-row .ch-num{ font-size:0.9rem; }

      .ch-next-trade-card{ display:flex; flex-direction:column; gap:14px; }
      .ch-next-trade-head{ display:flex; align-items:center; justify-content:space-between; }
      .ch-next-trade-tabs{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; }
      .ch-next-trade-tab{
        flex-shrink:0; padding:6px 12px; border-radius:999px; font-size:0.76rem; font-weight:700;
        background:var(--eva-surface-2); border:1px solid var(--eva-border); color:var(--eva-text-dim);
      }
      .ch-next-trade-tab.ch-active{ background:var(--eva-gradient); color:#fff; border-color:transparent; }
      .ch-next-trade-body{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
      @media (max-width:520px){ .ch-next-trade-body{ grid-template-columns:1fr; } }
      .ch-next-trade-stat{ background:var(--eva-surface-2); border-radius:var(--ch-radius-md); padding:14px; }
      .ch-next-trade-stat .ch-num{ font-size:1.4rem; }
      .ch-next-trade-status{ display:flex; align-items:center; justify-content:center; gap:8px; padding:12px; border-radius:var(--ch-radius-md); font-weight:700; font-size:0.86rem; }

      /* ---------------------------------------------------------
         7. RULE MONITOR
         --------------------------------------------------------- */
      .ch-rule-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
      @media (max-width:700px){ .ch-rule-grid{ grid-template-columns:1fr; } }
      .ch-rule-row{
        display:flex; align-items:center; justify-content:space-between; gap:10px;
        padding:12px 14px; border-radius:var(--ch-radius-sm); background:var(--eva-surface-2); border:1px solid var(--eva-border);
      }
      .ch-rule-name{ font-size:0.84rem; font-weight:600; display:flex; align-items:center; gap:8px; }
      .ch-rule-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
      .ch-rule-dot.ch-safe{ background:var(--ch-safe); box-shadow:0 0 8px var(--ch-safe); }

              <div class="ch-timeline-rail"><div class="ch-timeline-dot"></div><div class="ch-timeline-line"></div></div>
              <div class="ch-timeline-body"><div class="ch-timeline-title">Phase 2 Passed</div><div class="ch-timeline-date">Pending</div></div>
            </div>
            <div class="ch-timeline-item">
              <div class="ch-timeline-rail"><div class="ch-timeline-dot"></div><div class="ch-timeline-line"></div></div>
              <div class="ch-timeline-body"><div class="ch-timeline-title">Funded</div><div class="ch-timeline-date">Pending</div></div>
            </div>
            <div class="ch-timeline-item">
              <div class="ch-timeline-rail"><div class="ch-timeline-dot"></div></div>
              <div class="ch-timeline-body"><div class="ch-timeline-title">Payout</div><div class="ch-timeline-date">Pending</div></div>
            </div>
          </div>
        </div>
      </div>

      <!-- =====================================================
           ACCOUNT ALERT CENTER
           ===================================================== -->
      <div class="ch-section" id="account-alert-center">
        <div class="ch-section-head"><div class="ch-section-title">
          <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          Alert Center
        </div></div>
        <div class="ch-card">
          <div class="ch-alert-list">
            <div class="ch-alert ch-alert-warning">
              <span class="ch-alert-icon"><svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span>
              <div><div class="ch-alert-title">Daily drawdown approaching</div><div class="ch-alert-desc">You've used 40% of today's drawdown limit.</div></div>
              <span class="ch-alert-time">2h ago</span>
            </div>
            <div class="ch-alert ch-alert-success">
              <span class="ch-alert-icon"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></span>
              <div><div class="ch-alert-title">Target almost reached</div><div class="ch-alert-desc">42% of your Phase 1 profit target is complete.</div></div>
              <span class="ch-alert-time">5h ago</span>
            </div>
            <div class="ch-alert ch-alert-info">
              <span class="ch-alert-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></span>
              <div><div class="ch-alert-title">Deadline approaching</div><div class="ch-alert-desc">23 days remain to complete Phase 1.</div></div>
              <span class="ch-alert-time">1d ago</span>
            </div>
          </div>
        </div>
      </div>

      <!-- =====================================================
           STATE REFERENCE: empty / loading / error
           (demo only — JS swaps these in per-component at runtime)
           ===================================================== -->
      <div class="ch-section" id="state-reference" style="display:none;" aria-hidden="true">
        <div class="ch-grid ch-grid-3">
          <div class="ch-card">
            <div class="ch-empty">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
              <strong>No trades yet.</strong>
              <span>Trades will appear here once logged.</span>
            </div>
          </div>
          <div class="ch-card">
            <div class="ch-skel" style="height:14px; width:60%; margin-bottom:10px;"></div>
            <div class="ch-skel" style="height:28px; width:40%; margin-bottom:14px;"></div>
            <div class="ch-skel" style="height:8px; width:100%;"></div>
          </div>
          <div class="ch-card">
            <div class="ch-error">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              <span>Unable to load challenge data.</span>
              <span class="ch-error-actions"><button class="ch-btn">Try again</button></span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </template>

  <script src="eva-loader.js"></script>

  <!-- Modal open/close + real Firebase save logic for both the Add Trade
       and Create Account modals now lives entirely in challenge.js, so
       there is exactly one implementation of each and no duplicate,
       visual-only handlers left behind. -->
  <script type="module" src="challenge.js"></script>
</body>
</html>
